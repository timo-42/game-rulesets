name: Publish

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Package index to publish to"
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi
          - both

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Verify PyPI tag
        if: ${{ inputs.target == 'pypi' || inputs.target == 'both' }}
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "Publish workflow must be run from a Git tag, not ${GITHUB_REF_TYPE}."
            exit 1
          fi
          VERSION=$(uv run --with setuptools-scm --python 3.12 python -m setuptools_scm)
          EXPECTED_TAG="v${VERSION}"
          if [ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${VERSION}; expected ${EXPECTED_TAG}."
            exit 1
          fi
      - name: Show package version
        run: uv run --with setuptools-scm --python 3.12 python -m setuptools_scm
      - name: Install dependencies
        run: uv sync --extra dev --python 3.12
      - name: Run checks
        run: |
          uv run ruff check src tests
          uv run mypy src
          uv run pytest
      - name: Build package
        run: uv run python -m build
      - name: Check distribution metadata
        run: uv run twine check dist/*
      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-testpypi:
    needs: build
    if: ${{ inputs.target == 'testpypi' || inputs.target == 'both' }}
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v5
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: build
    if: ${{ inputs.target == 'pypi' || inputs.target == 'both' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v5
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
